name: aethos_prime
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy<2.0
  - pytorch
  - cpuonly

  # EXPLICIT INVARIANTS:
  # Force modern arrow and datasets from conda-forge
  - pyarrow>=14.0.1
  - datasets>=2.18.0

  # SEMANTIC ENGINE
  - scikit-learn
  - sentence-transformers

  - pip:
    - pywebview
    - psutil
    - mpmath
    - flask
    - flask_socketio
    - wmi
    - pycaw
    - comtypes
    - nvidia-ml-py
    - pywin32
    - keyboard
